name: 🚀 Deploy a DonWeb

on:
  push:
    branches:
      - main # o "master", según la rama principal de tu repo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repo
      - name: Checkout code
        uses: actions/checkout@v4 # Actualizado a v4

      # 2. Instalar Node
      - name: Setup Node.js
        uses: actions/setup-node@v4 # Actualizado a v4
        with:
          node-version: '20'
          cache: 'npm' # Cachea dependencias para builds más rápidos

      # 3. Instalar dependencias
      - name: Install dependencies
        run: npm ci # Más rápido y confiable que npm install

      # 4. Compilar Astro
      - name: Build Astro site
        run: npm run build

      # 5. Verificar que se generó el build
      - name: Check build output
        run: |
          echo "Contenido de dist/:"
          ls -la dist/
          echo "Total de archivos:"
          find dist/ -type f | wc -l

      # 6. Subir por FTP a DonWeb
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/ # Agregado ./ y /
          server-dir: /public_html/ # Agregado / al inicio y final
          port: 21 # Puerto explícito
          protocol: ftp # Protocolo explícito
          security: loose # Para servidores con SSL problemático
          timeout: 30000 # 30 segundos de timeout
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            **/.env*
          dry-run: false # Cambiar a true para probar sin subir
          log-level: verbose # Para ver más detalles del proceso
